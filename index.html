<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Something For You 💌</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Georgia", serif;
            background: #fff7f2;
            overflow: hidden;
            color: #6d4c4c;
        }

        /* Soft background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.35;
            z-index: 0;
        }

        .circle.one {
            width: 300px;
            height: 300px;
            background: #f9d5dc;
            top: -100px;
            left: -80px;
        }

        .circle.two {
            width: 250px;
            height: 250px;
            background: #f5dfb8;
            bottom: -80px;
            right: -60px;
        }

        /* Main card */

        .container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 1050px;
            min-height: 600px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 35px;
            box-shadow: 0 20px 60px rgba(120, 80, 80, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 50px;
            backdrop-filter: blur(10px);
        }

        /* Text section */

        .message {
            width: 45%;
            text-align: center;
        }

        .small-text {
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b58b8b;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 55px;
            font-weight: normal;
            color: #7b4f58;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        h1 span {
            color: #c77c8c;
            font-style: italic;
        }

        .message p {
            font-size: 18px;
            line-height: 1.7;
            color: #806767;
            margin-bottom: 30px;
        }

        /* Button */

        .open-button {
            border: none;
            background: #c98292;
            color: white;
            padding: 15px 32px;
            border-radius: 40px;
            font-size: 16px;
            font-family: Georgia, serif;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(180, 100, 120, 0.25);
            transition: 0.3s ease;
        }

        .open-button:hover {
            transform: translateY(-4px);
            background: #b96f80;
            box-shadow: 0 12px 25px rgba(180, 100, 120, 0.3);
        }

        /* Illustration */

        .illustration {
            position: relative;
            width: 45%;
            height: 450px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Bouquet */

        .bouquet {
            position: absolute;
            left: 20px;
            bottom: 45px;
            font-size: 130px;
            transform: rotate(-8deg);
            animation: float 4s ease-in-out infinite;
        }

        /* Letters */

        .letters {
            position: relative;
            width: 280px;
            height: 230px;
            margin-left: 100px;
        }

        .envelope {
            position: absolute;
            width: 210px;
            height: 140px;
            background: #f4d4d7;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(120, 80, 80, 0.15);
        }

        .envelope::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 105px solid transparent;
            border-right: 105px solid transparent;
            border-top: 70px solid #e9b9c1;
        }

        .envelope.one {
            transform: rotate(-13deg);
            left: 20px;
            top: 30px;
            background: #f5dfe1;
        }

        .envelope.two {
            transform: rotate(8deg);
            left: 65px;
            top: 5px;
            background: #f7e3c9;
        }

        .envelope.three {
            transform: rotate(-3deg);
            left: 45px;
            top: 55px;
            background: #ead0dc;
        }

        /* Ribbon */

        .ribbon {
            position: absolute;
            width: 25px;
            height: 180px;
            background: #c98292;
            top: 10px;
            left: 140px;
            transform: rotate(4deg);
            opacity: 0.8;
        }

        /* Floating decorations */

        .heart {
            position: absolute;
            font-size: 22px;
            animation: float 4s ease-in-out infinite;
        }

        .heart.one {
            top: 30px;
            right: 100px;
        }

        .heart.two {
            bottom: 80px;
            right: 30px;
            animation-delay: 1s;
        }

        .heart.three {
            top: 100px;
            left: 20px;
            animation-delay: 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Mobile */

        @media (max-width: 750px) {

            body {
                overflow: auto;
                padding: 20px;
            }

            .container {
                flex-direction: column;
                padding: 40px 20px;
                min-height: 90vh;
            }

            .message {
                width: 100%;
            }

            h1 {
                font-size: 42px;
            }

            .illustration {
                width: 100%;
                height: 330px;
            }

            .bouquet {
                left: 0;
                font-size: 90px;
            }

            .letters {
                margin-left: 70px;
                transform: scale(0.8);
            }
        }
    </style>
</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="message">

            <div class="small-text">
                A little something from home ♡
            </div>

            <h1>
                Happy Birthday,<br>
                <span>my favourite person</span>
            </h1>

            <p>
                I couldn't send you a whole box of hugs
                across the miles...
                so I made you something instead. 💌
            </p>

            <button class="open-button" onclick="openGift()">
                Open your gift 🎁
            </button>

        </div>

        <!-- RIGHT SIDE -->
        <div class="illustration">

            <div class="heart one">♡</div>
            <div class="heart two">✦</div>
            <div class="heart three">♡</div>

            <div class="bouquet">
                💐
            </div>

            <div class="letters">

                <div class="envelope one"></div>
                <div class="envelope two"></div>
                <div class="envelope three"></div>


            </div>

        </div>

    </div>

    <script>
function openGift() {
    window.location.href = "Letters.html";
}
</script>

</body>
</html>
